name: Update 2FA client flow

on:
  push:
    branches: [main]

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip-2fa-update]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch gamesvaultshop.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('gamesvaultshop.py')
          s = p.read_text(encoding='utf-8')

          old = '''VERIFY_IMAGES = {
              "email": "https://consumer.ftc.gov/sites/default/files/styles/scaled_lg/public/consumer_ftc_gov/images/multi-factor%20authentication%20graphics-02_0.png?itok=gPP2hIAW",
              "authenticator": "https://consumer.ftc.gov/sites/default/files/styles/scaled_lg/public/consumer_ftc_gov/images/multi-factor%20authentication%20graphics-02_0.png?itok=gPP2hIAW",
              "device": "https://resizer.mail.ru/p/5f0e6e7b-cdef-570b-9869-c16749b6d393/AQAKs2qbhaNr687UDo3QjKpea-h_lfOMbiSocjLtusXubCOvMm2oeHP6IQnR8A4qaxwc2z9Y_Rob0lP7QmnmKWYZ1ig.jpg",
          }'''
          new = '''VERIFY_IMAGES = {
              "device": "https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/5X/a/4/c/b/a4cb7f66e45935445932f8d966013463406a251e.png",
              "authenticator": "https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/5X/8/d/a/5/8da5d76034856021ad807288f8c8e8a43c66a8b4.png",
              "email": "https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/5X/4/2/6/8/4268f5cf79d76d381d13648d545b8929d562ae08.png",
          }'''
          assert old in s, 'VERIFY_IMAGES block not found'
          s = s.replace(old, new, 1)

          old = '        "support_waiting": False, "verification_type": None,\n'
          new = '        "support_waiting": False, "verification_type": None, "verification_done": False,\n'
          assert old in s, 'blank_user verification field not found'
          s = s.replace(old, new, 1)

          old = '"support_waiting": False, "verification_type": None, "refund_waiting": False'
          new = '"support_waiting": False, "verification_type": None, "verification_done": False, "refund_waiting": False'
          assert old in s, 'choose_game reset block not found'
          s = s.replace(old, new, 1)

          old = '''def admin_verify_kb(uid):
    return InlineKeyboardMarkup(inline_keyboard=[[InlineKeyboardButton(text="📧 E-mail", callback_data=f"verify:{uid}:email")], [InlineKeyboardButton(text="🔐 Authenticator", callback_data=f"verify:{uid}:authenticator")], [InlineKeyboardButton(text="📱 Այլ սարքով հաստատում", callback_data=f"verify:{uid}:device")], [InlineKeyboardButton(text="⬅️ Հետ", callback_data=f"verify_back:{uid}")]])'''
          new = '''def admin_verify_kb(uid):
    return InlineKeyboardMarkup(inline_keyboard=[
        [InlineKeyboardButton(text="📧 E-mail", callback_data=f"verify:{uid}:email")],
        [InlineKeyboardButton(text="🔐 Authenticator", callback_data=f"verify:{uid}:authenticator")],
        [InlineKeyboardButton(text="📱 Այլ սարքով հաստատում", callback_data=f"verify:{uid}:device")],
        [InlineKeyboardButton(text="⬅️ Հետ", callback_data=f"verify_back:{uid}")],
    ])


def client_verify_done_kb():
    return InlineKeyboardMarkup(inline_keyboard=[
        [InlineKeyboardButton(text="✅ Մուտքը հաստատեցի", callback_data="verify_done")],
        [InlineKeyboardButton(text="⬅️ Հետ", callback_data="back:main")],
    ])'''
          assert old in s, 'admin_verify_kb block not found'
          s = s.replace(old, new, 1)

          old = '''async def send_verification_instruction(uid, kind):
    user = get_user(uid)
    user["verification_type"] = kind
    await save_state()
    text = verification_text(kind)
    image = VERIFY_IMAGES.get(kind)
    try:
        if image:
            await bot.send_photo(uid, image, caption=text, parse_mode="HTML")
        else:
            await bot.send_message(uid, text, parse_mode="HTML")
    except Exception:
        logging.exception("verification image/message failed")
        await notify(uid, text)'''
          new = '''async def send_verification_instruction(uid, kind):
    user = get_user(uid)
    user["verification_type"] = kind
    user["verification_done"] = False
    await save_state()
    text = verification_text(kind)
    image = VERIFY_IMAGES.get(kind)
    try:
        if image:
            await bot.send_photo(uid, image, caption=text, parse_mode="HTML", reply_markup=client_verify_done_kb())
        else:
            await bot.send_message(uid, text, parse_mode="HTML", reply_markup=client_verify_done_kb())
    except Exception:
        logging.exception("verification image/message failed")
        await notify(uid, text, client_verify_done_kb())'''
          assert old in s, 'send_verification_instruction block not found'
          s = s.replace(old, new, 1)

          old = '''    if action == "confirm":
        if not user.get("receipt_accepted"):
            await callback.answer("⚠️ Նախ հաստատիր չեկը։", show_alert=True)
            return
        await finalize(uid, "📦 Պատվերը հաստատված է — Դոնաթը հաջողությամբ ավարտված է.", "🎉 <b>Դոնաթը հաջողությամբ ավարտված է։</b> ❤️‍🔥\\n\\nՇնորհակալություն Games Vault Shop-ը ընտրելու համար։ 💎")'''
          new = '''    if action == "confirm":
        if not user.get("receipt_accepted"):
            await callback.answer("⚠️ Նախ հաստատիր չեկը։", show_alert=True)
            return
        if user.get("verification_type") and not user.get("verification_done"):
            await callback.answer("⚠️ Սպասիր, մինչև հաճախորդը հաստատի մուտքը 2FA-ով։", show_alert=True)
            return
        await finalize(uid, "📦 Պատվերը հաստատված է — Դոնաթը հաջողությամբ ավարտված է.", "🎉 <b>Դոնաթը հաջողությամբ ավարտված է։</b> ❤️‍🔥\\n\\nՇնորհակալություն Games Vault Shop-ը ընտրելու համար։ 💎")'''
          assert old in s, 'confirm block not found'
          s = s.replace(old, new, 1)

          marker = '''@dp.callback_query(F.data.startswith("refundclient:operator:"))'''
          handler = '''@dp.callback_query(F.data == "verify_done")
async def verify_done(callback: CallbackQuery):
    uid = callback.from_user.id
    user = get_user(uid)
    if not user.get("verification_type"):
        await callback.answer("⚠️ Այս պահին 2FA ստուգում ընտրված չէ։", show_alert=True)
        return
    user["verification_done"] = True
    await save_state()
    await notify(ADMIN_ID, order_summary(uid, user, "🟢 Հաճախորդը հաստատեց 2FA մուտքը։ Կարող եք շարունակել պատվերը."), admin_kb(uid, True, user.get("refund_details_ready", False)))
    try:
        await callback.message.edit_reply_markup(reply_markup=back_kb("back:main"))
    except Exception:
        logging.exception("Could not update client 2FA message")
    await callback.answer("✅ Հաստատումը ստացվեց։")


'''
          assert marker in s, 'refund operator marker not found'
          s = s.replace(marker, handler + marker, 1)

          old = '''    user["verification_type"] = kind
    await save_state()
    await callback.message.edit_caption'''
          new = '''    user["verification_type"] = kind
    user["verification_done"] = False
    await save_state()
    await callback.message.edit_caption'''
          assert old in s, 'verify callback state block not found'
          s = s.replace(old, new, 1)

          old = '''    await callback.message.edit_caption(caption=order_summary(uid, user, "🔐 Ընտրիր 2FA տարբերակը для клиента."), parse_mode="HTML", reply_markup=admin_verify_kb(uid))'''
          new = '''    await callback.message.edit_caption(caption=order_summary(uid, user, "🔐 Ընտրիր 2FA տարբերակը հաճախորդի համար."), parse_mode="HTML", reply_markup=admin_verify_kb(uid))'''
          assert old in s, 'verify menu text not found'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('gamesvaultshop.py patched successfully')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamesvaultshop.py
          git commit -m 'Fix Roblox 2FA client flow [skip-2fa-update]' || exit 0
          git push
